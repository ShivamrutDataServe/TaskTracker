[pytest]
# Without this, `pytest -v` run from CI (as opposed to `python -m pytest`
# run locally) never adds the repo root to sys.path, so
# `from app import app` in tests/test_api.py fails with
# "ModuleNotFoundError: No module named 'app'" even though the exact same
# command works when invoked as `python -m pytest`.
pythonpath = .
testpaths = tests
