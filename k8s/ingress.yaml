apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasktracker-ingress
  labels:
    app: tasktracker-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
  - host: tasktracker.internal.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tasktracker-app-service
            port:
              number: 80