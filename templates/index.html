<!DOCTYPE html>
<html>
<head>
    <title>TaskTracker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f7f8fa; }
        .container { max-width: 460px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #222; }
        form { display: flex; flex-direction: column; }
        label { margin-top: 10px; font-size: 14px; color: #444; }
        input, select { margin: 5px 0; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { margin-top: 15px; padding: 12px; background: #6f42c1; color: white; border: none; border-radius: 5px; font-size: 15px; cursor: pointer; }
        button:hover { background: #5a34a0; }
        .result { margin-top: 20px; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; }
        .result.churn { background: #fdecea; color: #b3261e; }
        .result.stay { background: #eaf7ed; color: #1e7b34; }
    </style>
</head>
<body>
    <div class="container">
        <h2>TaskTracker</h2>
        <form action="/predict_form" method="post">
            <label>Tenure (months)</label>
            <input type="number" step="1" name="tenure_months" min="0" max="100" required>

            <label>Monthly Charges ($)</label>
            <input type="number" step="0.01" name="monthly_charges" min="0" required>

            <label>Total Charges ($)</label>
            <input type="number" step="0.01" name="total_charges" min="0" required>

            <label>Contract Type</label>
            <select name="contract_type" required>
                <option value="0">Month-to-month</option>
                <option value="1">One year</option>
                <option value="2">Two year</option>
            </select>

            <label>Support Calls (last 12 months)</label>
            <input type="number" step="1" name="support_calls" min="0" max="20" required>

            <label>Senior Citizen</label>
            <select name="is_senior_citizen" required>
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>

            <label>Has Tech Support</label>
            <select name="has_tech_support" required>
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>

            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
        <div class="result {{ 'churn' if 'churn' in prediction else 'stay' }}">
            {{ prediction }} &mdash; {{ probability }}% churn probability
        </div>
        {% endif %}
    </div>
</body>
</html>
